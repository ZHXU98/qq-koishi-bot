version: "3.8"

# ============================================================
# 当前架构（2026-09-02 起）：官方适配器默认启用，NapCat 作为备用通道保留
#   - official-bot-gateway：官方开放平台机器人网关（快讯查询 + 每日汇总 + qq-reply 通道）
#   - qq-reply：官方通道回复服务（接 official-bot-gateway，权限配置 reply/config.json）
#   - ths-news：快讯转发（发送走官方网关）
#   - napcat / qq-reply-napcat：备用通道，服务段注释保留、默认不启动
# 配置热加载：config 文件每条消息重读盘，改完无需重启。
# ============================================================

services:
  # ==================== NapCat 非官方备用通道（默认未启动） ====================
  # 如需恢复：取消下方 napcat / qq-reply-napcat 两段注释 → docker compose up -d napcat qq-reply-napcat
  # → NapCat 需重新扫码（登录态在 ./napcat/QQ，失效则 docker restart napcat 出新二维码）
  # 注意：个人号有风控/掉线风险；权限独立配置 reply/config.napcat.json（与官方 config.json 分开）
  # napcat:
  #   image: mlikiowa/napcat-docker:latest
  #   container_name: napcat
  #   restart: unless-stopped
  #   hostname: napcat-dev
  #   environment:
  #     - NAPCAT_UID=0
  #     - ACCOUNT=${QQ_ACCOUNT}
  #     - NAPCAT_QUICK_ACCOUNT=${QQ_ACCOUNT}
  #     # 密码回退失败即转扫码（entrypoint-login-patch.sh 补丁）
  #     - NAPCAT_QUICK_PASSWORD=${QQ_QUICK_PASSWORD}
  #   entrypoint: ["bash", "/app/entrypoint-login-patch.sh"]
  #   networks:
  #     botnet:
  #       mac_address: "f2:e2:0d:04:cc:1d"
  #   volumes:
  #     - ./napcat/config:/app/napcat/config
  #     - ./napcat/QQ:/app/.config/QQ
  #     - ./napcat/entrypoint-login-patch.sh:/app/entrypoint-login-patch.sh:ro
  #     - ./napcat/machine-id:/etc/machine-id:ro
  #   ports:
  #     - "6099:6099"
  #     - "5140:5140"
  #     - "3000:3000"

  # 快讯转发（2026-08-26 起发送走官方网关，原 10 分钟检查频率不变）
  ths-news:
    image: node:22-alpine
    container_name: ths-news
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - official-bot-gateway
    volumes:
      - ./ths-news/fetch_ths_news.js:/app/fetch_ths_news.js:ro
      - ./ths-news/ths_news_targets.json:/app/ths_news_targets.json:ro
      - ./ths-news/news_rules.json:/app/news_rules.json:ro
      - ./ths-news/start_news_cron.sh:/app/start_news_cron.sh:ro
      - ./ths-news/fonts:/app/fonts:ro
      - ths-news-state:/app/state
      - ths-news-modules:/app/node_modules
    environment:
      # 发送走官方网关（官方群主动推送需平台权限；私聊主动每月 4 条）
      - NAPCAT_URL=http://official-bot-gateway:3100
      - TZ=Asia/Shanghai
      - NEWS_INTERVAL=300
      - THS_STATE=/app/state/ths_news_state.json
    # DNS：固定公共解析优先，Docker Desktop 内置解析器兜底（说明见 official-bot-gateway 段）
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 192.168.65.7
    networks:
      - botnet
    command: ["sh", "-c", "sh /app/start_news_cron.sh"]

  qq-reply:
    image: node:22-alpine
    container_name: qq-reply
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - official-bot-gateway
    volumes:
      # 2026-09-11：项目已拆分为多文件（config/utils/gateway/market/commands/*），整体挂载 src 目录
      - ./reply:/app
      # 2026-09-11：/stocks 组合数据（可写，非只读；容器内 /app/data/portfolios.json）
      - ./reply/data:/app/data
      # 2026-08-31：共享 ths-news 的 @resvg/resvg-js 渲染库与中文字体（/stock 图表用，只读）
      - ths-news-modules:/app/node_modules:ro
      - ./ths-news/fonts:/app/fonts:ro
      # 2026-09-16：/快讯 卡片改为复用 ths-news 渲染器。reply/commands/news.js 以
      #   require('../../ths-news/fetch_ths_news') 引用 → 容器内须解析到 /ths-news/…
      #   （/app/commands/ 上溯两级即根目录），故 ths-news 挂到根下，而非 /app/ths-news。
      #   该目录内的 require('@resvg/resvg-js') 靠下面的 NODE_PATH 指回共享依赖卷
      #   （:ro 的 bind 内无法再嵌套挂载卷，故不用嵌套挂载）。
      - ./ths-news:/ths-news:ro
    environment:
      - NODE_PATH=/app/node_modules
      # 2026-08-26：默认改接官方网关；BOT_UIN 与网关转发的 at.qq 一致（官方 APP_ID）
      - NAPCAT_WS_URL=ws://official-bot-gateway:3101
      - NAPCAT_URL=http://official-bot-gateway:3100
      - BOT_UIN=${QQBOT_APP_ID}
      - TZ=Asia/Shanghai
      # 2026-10-13：容器没有 IPv6 出口，而 Node 20+ 默认 autoSelectFamily=true（Happy Eyeballs），
      #   对双栈域名（Yahoo / eastmoney 等）按域名连接时会撞上死掉的 IPv6 → ETIMEDOUT / fetch failed
      #   秒失败，且表现为「同一个源时好时坏」。关掉自动选族后只走 v4（实测 Yahoo 立即可达）。
      #   ⚠️ 实测 --dns-result-order=ipv4first 无效（地址顺序本就 v4 在前，问题在 autoSelectFamily）。
      #   ⚠️ 改 env 必须 `docker compose up -d qq-reply` 重建容器，`restart` 不生效。
      - NODE_OPTIONS=--no-network-family-autoselection
    # DNS：固定公共解析优先，Docker Desktop 内置解析器兜底（说明见 official-bot-gateway 段）
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 192.168.65.7
    networks:
      - botnet
    command: ["node", "/app/index.js"]

  # NapCat 通道回复服务（默认未启动；如需恢复随 napcat 一起取消注释）
  # 完整挂载模块化 reply 源码，并用 config.napcat.json 覆盖默认配置（与官方通道权限隔离）
  # qq-reply-napcat:
  #   image: node:22-alpine
  #   container_name: qq-reply-napcat
  #   restart: unless-stopped
  #   working_dir: /app
  #   depends_on:
  #     - napcat
  #   volumes:
  #     - ./reply:/app
  #     - ./reply/config.napcat.json:/app/config.json:ro
  #     - ./reply/data:/app/data
  #     - ths-news-modules:/app/node_modules:ro
  #     - ./ths-news/fonts:/app/fonts:ro
  #     - ./ths-news:/ths-news:ro
  #   environment:
  #     - NODE_PATH=/app/node_modules
  #     - NAPCAT_WS_URL=ws://napcat:3001
  #     - NAPCAT_URL=http://napcat:3000
  #     - BOT_UIN=${QQ_ACCOUNT}
  #     - TZ=Asia/Shanghai
  #     - NODE_OPTIONS=--no-network-family-autoselection
  #   dns:
  #     - 223.5.5.5
  #     - 119.29.29.29
  #     - 192.168.65.7
  #   networks:
  #     - botnet
  #   command: ["node", "/app/index.js"]

  # 官方 QQ 机器人网关（默认适配器）：OneBot 兼容层，接入官方开放平台（appid+appsecret）
  # 与 NapCat 并行运行，互不影响；跑通后可把 ths-news/qq-reply 的 NAPCAT_URL 指向本网关
  official-bot-gateway:
    image: node:22-alpine
    container_name: official-bot-gateway
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./official-bot-gateway:/app
    environment:
      - QQBOT_APP_ID=${QQBOT_APP_ID}
      - QQBOT_APP_SECRET=${QQBOT_APP_SECRET}
      - OWNER_QQ=1547450303
      - TZ=Asia/Shanghai
      - GW_HTTP_PORT=3100
      - GW_WS_PORT=3101
    networks:
      - botnet
    ports:
      - "3100:3100"
      - "3101:3101"
    # DNS：前两个是固定公共解析（阿里 / 腾讯），最后一个是 Docker Desktop 内置解析器 ——
    #   固定 DNS 都不可达时自动回落宿主解析（实测：不可达时会等约 4s 后回落成功）。
    #   容器名（official-bot-gateway 等）由 Docker 内嵌 DNS 解析，不受此列表影响。
    #   ⚠️ 192.168.65.7 是 Docker Desktop(macOS) 的内网解析器地址；换 Linux 宿主时该地址不同，
    #      若宿主本就能稳定解析，删掉这一项即可。
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 192.168.65.7
    # 启动命令不再每次跑 npm install（依赖已持久化在 ./official-bot-gateway/node_modules，
    #   bind mount 会保留）—— 旧写法在 DNS/网络抖动时会卡在装依赖，拖慢恢复。
    #   ⚠️ 首次部署、或改过 package.json 后，需先手动装一次依赖：
    #     docker run --rm -v "$PWD/official-bot-gateway:/app" -w /app node:22-alpine \
    #       npm install --no-audit --no-fund --registry=https://registry.npmmirror.com
    command: ["node", "/app/index.js"]

  # koishi:
  #   image: koishijs/koishi:latest
  #   container_name: koishi
  #   restart: unless-stopped
  #   depends_on:
  #     - napcat
  #   volumes:
  #     - ./koishi/data:/koishi/data
  #   network_mode: "service:napcat"
  #   environment:
  #     - TZ=Asia/Shanghai

  # rsshub:
    # image: diygod/rsshub:latest
    # container_name: rsshub
    # restart: unless-stopped
    # ports:
    #   - "1200:1200"
    # environment:
    #   - NODE_ENV=production
    # networks:
    #   - botnet

networks:
  botnet:
    driver: bridge

volumes:
  ths-news-state:
  ths-news-modules:
