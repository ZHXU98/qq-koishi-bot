version: "3.8"

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    # 固定主机名：容器重建后 hostname 不再变成新容器 ID，设备指纹进一步稳定
    hostname: napcat-dev
    environment:
      - NAPCAT_UID=0
      - ACCOUNT=${QQ_ACCOUNT}
      # 自动复用已保存的"快速登录"票据：容器每次重启会自动用本地存储的登录态登录，
      # 不再需要重新扫码（除非 QQ 服务端主动让票据失效，那种情况才需重扫一次）
      - NAPCAT_QUICK_ACCOUNT=${QQ_ACCOUNT}
      # 票据失效时的密码回退：自动用 ACCOUNT + 密码快速登录，免手动扫码
      - NAPCAT_QUICK_PASSWORD=${QQ_QUICK_PASSWORD}
    networks:
      # 固定容器 MAC 地址：无论容器 restart 还是被删除重建，网卡 MAC 保持不变，
      # QQ 设备指纹（machine-info 基于 MAC 派生）不再变化，避免反复触发"新设备验证/扫码"
      # （2026-08-19 固化：当日因容器重建 MAC 变化导致设备 ID 更换需重新扫码）
      botnet:
        mac_address: "f2:e2:0d:04:cc:1d"
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/QQ:/app/.config/QQ
    ports:
      - "6099:6099"
      - "5140:5140"
      - "3000:3000"

  ths-news:
    image: node:22-alpine
    container_name: ths-news
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - napcat
    volumes:
      - ./ths-news/fetch_ths_news.js:/app/fetch_ths_news.js:ro
      - ./ths-news/ths_news_targets.json:/app/ths_news_targets.json:ro
      - ./ths-news/start_news_cron.sh:/app/start_news_cron.sh:ro
      - ./ths-news/fonts:/app/fonts:ro
      - ths-news-state:/app/state
      - ths-news-modules:/app/node_modules
    environment:
      - NAPCAT_URL=http://napcat:3000
      - TZ=Asia/Shanghai
      - NEWS_INTERVAL=600
      - THS_STATE=/app/state/ths_news_state.json
    networks:
      - botnet
    command: ["sh", "-c", "sh /app/start_news_cron.sh"]

  qq-reply:
    image: node:22-alpine
    container_name: qq-reply
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - napcat
    volumes:
      - ./reply/index.js:/app/index.js:ro
      - ./reply/package.json:/app/package.json:ro
      - ./reply/config.json:/app/config.json:ro
    environment:
      - NAPCAT_WS_URL=ws://napcat:3001
      - NAPCAT_URL=http://napcat:3000
      - BOT_UIN=${QQ_ACCOUNT}
      - TZ=Asia/Shanghai
    networks:
      - botnet
    command: ["node", "/app/index.js"]

  # koishi:
