version: "3.8"

# ============================================================
# 当前架构（2026-08-26 起）：官方 QQ 机器人通道为主
#   - official-bot-gateway：官方开放平台机器人网关（快讯查询 + 每日汇总 + qq-reply 通道）
#   - qq-reply：被@回复服务（接官方网关）
#   - napcat / ths-news：旧 NapCat 转发链路，已注释停用（个人号易被风控踢线）。
#     如需重新启用（例如官方群推送权限开通前临时恢复实时转发）：
#       1. 取消下方 napcat / ths-news 两个服务的注释（# 开头）
#       2. docker compose up -d napcat ths-news
#       3. NapCat 需重新扫码登录（私聊官方机器人或对话中向 AI 索取二维码）
#     恢复后 ths-news 每 10 分钟照常转发到 private/groups 配置的目标。
# ============================================================

services:
  # ==================== 旧链路（已停用，保留可恢复） ====================
  # napcat:
  #   image: mlikiowa/napcat-docker:latest
  #   container_name: napcat
  #   restart: unless-stopped
  #   hostname: napcat-dev
  #   environment:
  #     - NAPCAT_UID=0
  #     - ACCOUNT=${QQ_ACCOUNT}
  #     - NAPCAT_QUICK_ACCOUNT=${QQ_ACCOUNT}
  #     # 密码回退失败即转扫码（entrypoint-login-patch.sh 补丁）
  #     - NAPCAT_QUICK_PASSWORD=${QQ_QUICK_PASSWORD}
  #   entrypoint: ["bash", "/app/entrypoint-login-patch.sh"]
  #   networks:
  #     botnet:
  #       mac_address: "f2:e2:0d:04:cc:1d"
  #   volumes:
  #     - ./napcat/config:/app/napcat/config
  #     - ./napcat/QQ:/app/.config/QQ
  #     - ./napcat/entrypoint-login-patch.sh:/app/entrypoint-login-patch.sh:ro
  #     - ./napcat/machine-id:/etc/machine-id:ro
  #   ports:
  #     - "6099:6099"
  #     - "5140:5140"
  #     - "3000:3000"

  # 快讯转发（2026-08-26 起发送走官方网关，原 10 分钟检查频率不变）
  ths-news:
    image: node:22-alpine
    container_name: ths-news
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - official-bot-gateway
    volumes:
      - ./ths-news/fetch_ths_news.js:/app/fetch_ths_news.js:ro
      - ./ths-news/ths_news_targets.json:/app/ths_news_targets.json:ro
      - ./ths-news/start_news_cron.sh:/app/start_news_cron.sh:ro
      - ./ths-news/fonts:/app/fonts:ro
      - ths-news-state:/app/state
      - ths-news-modules:/app/node_modules
    environment:
      # 发送走官方网关（官方群主动推送需平台权限；私聊主动每月 4 条）
      - NAPCAT_URL=http://official-bot-gateway:3100
      - TZ=Asia/Shanghai
      - NEWS_INTERVAL=300
      - THS_STATE=/app/state/ths_news_state.json
    networks:
      - botnet
    command: ["sh", "-c", "sh /app/start_news_cron.sh"]

  qq-reply:
    image: node:22-alpine
    container_name: qq-reply
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - official-bot-gateway
    volumes:
      - ./reply/index.js:/app/index.js:ro
      - ./reply/package.json:/app/package.json:ro
      - ./reply/config.json:/app/config.json:ro
    environment:
      # 2026-08-26：改接官方网关（NapCat 弃用）；BOT_UIN 与网关转发的 at.qq 一致（官方 APP_ID）
      - NAPCAT_WS_URL=ws://official-bot-gateway:3101
      - NAPCAT_URL=http://official-bot-gateway:3100
      - BOT_UIN=${QQBOT_APP_ID}
      - TZ=Asia/Shanghai
    networks:
      - botnet
    command: ["node", "/app/index.js"]

  # 官方 QQ 机器人网关（新途径）：OneBot 兼容层，接入官方开放平台（appid+appsecret）
  # 与 NapCat 并行运行，互不影响；跑通后可把 ths-news/qq-reply 的 NAPCAT_URL 指向本网关
  official-bot-gateway:
    image: node:22-alpine
    container_name: official-bot-gateway
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./official-bot-gateway:/app
    environment:
      - QQBOT_APP_ID=${QQBOT_APP_ID}
      - QQBOT_APP_SECRET=${QQBOT_APP_SECRET}
      - OWNER_QQ=1547450303
      - TZ=Asia/Shanghai
      - GW_HTTP_PORT=3100
      - GW_WS_PORT=3101
    networks:
      - botnet
    ports:
      - "3100:3100"
      - "3101:3101"
    command: ["sh", "-c", "npm install --no-audit --no-fund --registry=https://registry.npmmirror.com && exec node /app/index.js"]

  # koishi:
  #   image: koishijs/koishi:latest
  #   container_name: koishi
  #   restart: unless-stopped
  #   depends_on:
  #     - napcat
  #   volumes:
  #     - ./koishi/data:/koishi/data
  #   network_mode: "service:napcat"
  #   environment:
  #     - TZ=Asia/Shanghai

  # rsshub:
    # image: diygod/rsshub:latest
    # container_name: rsshub
    # restart: unless-stopped
    # ports:
    #   - "1200:1200"
    # environment:
    #   - NODE_ENV=production
    # networks:
    #   - botnet

networks:
  botnet:
    driver: bridge

volumes:
  ths-news-state:
  ths-news-modules:
