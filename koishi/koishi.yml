plugins:
  # ── 服务器 ──────────────────────────────────────────────
  group:server:
    server:
      port: 5140
      host: 0.0.0.0

  # ── 基础 ────────────────────────────────────────────────
  group:basic:
    admin: {}
    http: {}

  # ── 控制台 ──────────────────────────────────────────────
  group:console:
    auth:
      admin:
        enabled: true
        username: admin
        password: "admin123"
    config: {}
    console:
      open: false
    explorer: {}
    logger: {}

  # ── 存储 ────────────────────────────────────────────────
  group:storage:
    database-sqlite:
      path: data/koishi.db

  # ── QQ 适配器（Satori 协议，官方推荐方式）───────────────
  # NapCat 需要在 WebUI (http://localhost:6099) 里开启 Satori HTTP 服务（端口 2531）
  group:adapter:
    adapter-satori:
      endpoint: http://napcat:2531

  # ── RSS 订阅 ─────────────────────────────────────────────
  group:rss:
    "koishi-plugin-rss":
      request:
        timeout: 10000
        userAgent: "Mozilla/5.0 (compatible; Koishi RSS Bot)"
      refreshInterval: 300000
      authority:
        add: 3
        remove: 3
        list: 1
        check: 1
