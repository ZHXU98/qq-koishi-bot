name: koishi

# ============================================================
# Koishi 主配置文件
# 路径: koishi/koishi.yml
# 文档: https://koishi.chat/zh-CN/manual/usage/
# ============================================================

plugins:
  # ----------------------------------------------------------
  # 核心 / 日志 / 热重载
  # ----------------------------------------------------------
  logger: {}
  hmr: {}         # 热重载（开发时用，生产可注释掉）

  # ----------------------------------------------------------
  # Web 控制台
  # 访问 http://localhost:5140
  # ----------------------------------------------------------
  console:
    port: 5140
    # open: true     # 是否自动打开浏览器

  # 控制台登录（建议开启！防止控制台被未授权访问）
  auth:
    enabled: true
    # 首次运行会在控制台提示设置密码

  # ----------------------------------------------------------
  # 协议适配器：连接 NapCatQQ（OneBot v11）
  # ----------------------------------------------------------
  onebot:
    protocol: ws-reverse     # 反向 WebSocket（推荐）
    selfId: "${QQ_ACCOUNT}"  # 你的 QQ 号
    endpoint: "ws://napcat:3001"   # NapCatQQ WS 地址
    # token: ""              # 如果 NapCat 设置了 token，在这里填

  # ----------------------------------------------------------
  # 数据库（SQLite，本地存储，无需额外部署）
  # ----------------------------------------------------------
  database-sqlite:
    path: ./data/database.db

  # ----------------------------------------------------------
  # 权限控制系统
  # authority 等级：
  #   0 - 黑名单（被封禁）
  #   1 - 普通用户（默认）
  #   2 - 高级用户（可执行更多命令）
  #   3 - 管理员
  #   4 - 超级管理员
  #   5 - 机器人主人（最高权限）
  # ----------------------------------------------------------
  # 内置权限系统（已包含在框架中，无需额外安装）
  
  # 设置管理员：在 superusers 中填写你的 QQ 号
  # 也可以通过 Web 控制台的「用户管理」页面设置
  
  # ----------------------------------------------------------
  # RSS 订阅推送插件
  # npm 包名：koishi-plugin-rss（官方维护）
  # GitHub：https://github.com/koishijs/koishi-plugin-rss
  # ----------------------------------------------------------
  "koishi-plugin-rss":
    # 请求配置
    request:
      timeout: 10000     # 请求超时 10s
      userAgent: "Mozilla/5.0 (compatible; Koishi RSS Bot)"
    # 推送设置
    refreshInterval: 300000    # 刷新间隔，默认 5 分钟（毫秒）
    # 权限要求：authority >= 2 才能订阅 RSS（防止普通用户滥用）
    # 命令:
    #   rss.add <url>     添加订阅
    #   rss.remove <url>  取消订阅
    #   rss.list          查看订阅列表
    #   rss.check         立即检查更新

  # ----------------------------------------------------------
  # 指令权限精细控制（可选，推荐）
  # ----------------------------------------------------------
  # 通过 admin 插件可以在聊天中动态管理用户权限
  admin: {}   # 提供 authorize / ban 等管理命令

  # ----------------------------------------------------------
  # 常用附加插件（按需取消注释）
  # ----------------------------------------------------------
  # schedule: {}     # 定时任务
  # recall: {}       # 撤回消息
  # rate-limit: {}   # 频率限制（防刷屏）
  # puppeteer: {}    # 截图/渲染（部分插件需要）

# ============================================================
# 全局设置
# ============================================================
# 超级用户列表（填写 QQ 号，拥有最高权限）
superusers:
  - "你的QQ号"   # ← 修改为你自己的 QQ 号

# 默认 locale
locale: zh-CN
