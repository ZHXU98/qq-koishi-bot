plugins:
  # ── 服务器 ──────────────────────────────────────────────
  group:server:
    server:
      port: 5140
      host: 0.0.0.0

  # ── 基础 ────────────────────────────────────────────────
  group:basic:
    admin: {}
    http: {}

  # ── 控制台 ──────────────────────────────────────────────
  group:console:
    auth:
      admin:
        enabled: true
        username: admin
        password: "admin123"
    config: {}
    console:
      open: false
    explorer: {}
    logger: {}

  # ── 存储 ────────────────────────────────────────────────
  group:storage:
    database-sqlite:
      path: data/koishi.db

  # ── QQ 适配器（OneBot 11 WebSocket）──
  # koishi 共享 napcat 网络命名空间（network_mode: service:napcat）
  # NapCat 绑定 127.0.0.1:3001，koishi 直连
  group:adapter:
    adapter-onebot:
      protocol: ws
      endpoint: ws://127.0.0.1:3001
      selfId: "2804223545"

  # ── RSS 订阅 ─────────────────────────────────────────────
  group:rss:
    "koishi-plugin-rss":
      request:
        timeout: 10000
        userAgent: "Mozilla/5.0 (compatible; Koishi RSS Bot)"
      refreshInterval: 300000
      authority:
        add: 3
        remove: 3
        list: 1
        check: 1
